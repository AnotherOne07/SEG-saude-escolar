services:
  db:
    image: postgres:15-alpine
    container_name: plat_saude_db
    restart: always
    environment:
      POSTGRES_DB: bd_Plat_Saude
      POSTGRES_USER: platSaude
      POSTGRES_PASSWORD: engsoft2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/seed/instance.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platSaude -d bd_Plat_Saude"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plat_saude_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: bd_Plat_Saude
      DB_USER: platSaude
      DB_PASSWORD: engsoft2
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  pgdata:
